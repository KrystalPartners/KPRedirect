<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Continuer dans le navigateur</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#0b0e14;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(430px,100%);text-align:center}
.icon{font-size:54px;margin-bottom:16px}
h1{font-size:28px;line-height:1.15;margin:0 0 13px}
.sub{color:#aeb7c5;font-size:16px;line-height:1.5;margin:0 auto 28px;max-width:370px}
.btn{width:100%;border:0;border-radius:17px;padding:19px 18px;font-size:18px;font-weight:900;cursor:pointer;background:#fff;color:#0b0e14;box-shadow:0 8px 30px rgba(255,255,255,.08)}
.btn:active{transform:scale(.985)}
.small{color:#707a89;font-size:13px;line-height:1.4;margin-top:18px}
.fallback{display:none;margin-top:20px;padding:16px;border:1px solid #293241;border-radius:14px;color:#c1c8d2;font-size:14px;line-height:1.45}
.fallback a{color:#fff;font-weight:800}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🌐</div>
  <h1>Continuer dans ton navigateur</h1>
  <p class="sub">Ouvre le site dans Safari, Chrome ou ton navigateur habituel pour profiter de la meilleure expérience.</p>

  <button class="btn" id="openBtn">OUVRIR LE SITE 🚀</button>

  <div class="small">Un clic suffit.</div>

  <div class="fallback" id="fallback">
    Si ton navigateur ne s'est pas ouvert, utilise les <b>•••</b> de Telegram puis
    <b>« Ouvrir dans le navigateur »</b>, ou
    <a href="https://lesbonusde.com/Sabri">continue ici</a>.
  </div>
</div>

<script>
const DEST = "https://lesbonusde.com/Sabri";

function openExternal() {
  const ua = navigator.userAgent || "";
  const isiOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);

  if (isAndroid) {
    // Android: demande explicitement à Android d'ouvrir l'URL HTTPS
    // dans Chrome. Si Chrome n'est pas disponible, browser_fallback_url
    // permet de retomber sur l'URL HTTPS.
    const clean = DEST.replace(/^https?:\/\//, "");
    const fallback = encodeURIComponent(DEST);
    window.location.href =
      "intent://" + clean +
      "#Intent;scheme=https;package=com.android.chrome;" +
      "S.browser_fallback_url=" + fallback + ";end";
  } else if (isiOS) {
    // iOS: schéma Safari. L'appel vient directement du clic utilisateur,
    // ce qui donne la meilleure chance à iOS/Telegram de l'autoriser.
    const clean = DEST.replace(/^https:\/\//, "");
    window.location.href = "x-safari-https://" + clean;
  } else {
    // Desktop / autres plateformes.
    window.location.href = DEST;
  }

  // Affiche seulement un secours si l'utilisateur reste sur cette page.
  setTimeout(() => {
    document.getElementById("fallback").style.display = "block";
  }, 1800);
}

document.getElementById("openBtn").addEventListener("click", openExternal);
</script>
</body>
</html>
